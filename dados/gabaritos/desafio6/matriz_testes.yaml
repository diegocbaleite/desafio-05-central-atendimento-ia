versao_gabarito: "1.0"
# Resultado esperado copiado da seção 11 do PDF (Desafio Prático 02, v2.0). O PDF associa
# alguns cenários a RFs que não correspondem ao conteúdo (ex.: T01 cita RF15, mas trata
# de JSON/esquema, que é RF14). Os IDs e cenários foram mantidos; "rf_corrigido" registra
# o vínculo coerente com a seção 7, sem alterar o sentido do teste.
testes:
