projeto:
  nome: "Central Inteligente de Atendimento e Comunicação Institucional"
  orgao: "Secretaria Fictícia de Serviços ao Cidadão"
  timbre: "dados/originais/brasao.png"
  casos: "dados/originais/casos.yaml"

llm:
  provider: "openai"
  modelo: "gpt-6-luna"
  reasoning_effort: "none"
  temperatura: 0.2
  max_tokens: 2400
  timeout_s: 45

provedores:
  openai:
    base_url: "https://api.openai.com/v1"
    env_chave: "OPENAI_API_KEY"

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    env_chave: "OPENROUTER_API_KEY"

  groq:
    base_url: "https://api.groq.com/openai/v1"
    env_chave: "GROQ_API_KEY"

  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    base_url_nativa: "https://generativelanguage.googleapis.com/v1beta"
    env_chave: "GEMINI_API_KEY"

  cloudflare:
    base_url: "https://api.cloudflare.com/client/v4"
    env_chave: "CLOUDFLARE_API_KEY"
    env_conta: "CLOUDFLARE_ACCOUNT_ID"

multimodal:
  stt_provider: "openai"
  stt_modelo: "gpt-transcribe"

  # O formulário I01 contém escrita manual, fora do ponto forte do Tesseract.
  # O modo --mock usa referência fictícia rotulada e nunca envia a imagem ao provedor.
  ocr_provider: "openai"
  ocr_modelo: "gpt-6-luna"

  tts_provider: "openai"
  # Speech API existente; migração para Realtime necessária antes de 06/01/2027.
  tts_modelo: "gpt-4o-mini-tts"
  tts_voz: "coral"
  tts_voz_local: "pt-br"
  tts_velocidade: 145
  tts_tom: 45
  tts_volume: 100
  tts_pausa_palavras_ms: 5
  tts_instrucoes: "Fale em português brasileiro, com tom institucional, claro, acolhedor e ritmo moderado. Preserve fielmente o conteúdo, sem comentários adicionais."

  imagem_provider: "openai"
  imagem_modelo: "gpt-image-2.5-flare"
  imagem_tamanho: "1024x1536"
  imagem_qualidade: "low"

seguranca:
  marcador_ausente: "não localizado"
  envio_automatico: false
  revisao_obrigatoria: true

# Desafio 6 / Prático 02: geração e recuperação independentes.
desafio6:
  geracao:
    provider: "openai"
    modelo: "gpt-6-luna"
    reasoning_effort: "none"
    temperatura: 0.2
    max_tokens: 2400
    timeout_s: 30
  segunda_geracao:
    provider: "openai"
    modelo: "gpt-6.1-terra"
    reasoning_effort: "none"
  embeddings:
    modelo: "text-embedding-3-small"
    dimensao: 256
  chunking:
    tamanho: 90
    sobreposicao: 20
    unidade: "palavras"
    top_k: 3
  limites:
    max_chamadas: 12
    max_tokens: 60000
    max_caracteres: 12000
    max_arquivo_mib: 2
  limites_indexacao:
    max_chamadas: 12
    max_tokens: 200000
  retencao_dias: 30
