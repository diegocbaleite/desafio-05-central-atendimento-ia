projeto:
  nome: "Central Inteligente de Atendimento e Comunicação Institucional"
  orgao: "Secretaria Fictícia de Serviços ao Cidadão"
llm:
  provider: "mock" # mock | groq | openai | gemini
  modelo: "llama-3.3-70b-versatile"
  temperatura: 0.2
  max_tokens: 1200
  timeout_s: 45
provedores:
  groq: {base_url: "https://api.groq.com/openai/v1", env_chave: "GROQ_API_KEY"}
  openai: {base_url: "https://api.openai.com/v1", env_chave: "OPENAI_API_KEY"}
  gemini: {base_url: "https://generativelanguage.googleapis.com/v1beta/openai", env_chave: "GEMINI_API_KEY"}
multimodal:
  stt_provider: "groq"
  stt_modelo: "whisper-large-v3-turbo"
  tts_provider: "espeak" # espeak | openai
  tts_modelo: "gpt-4o-mini-tts"
  tts_voz: "coral"
  imagem_provider: "local" # local | openai
  imagem_modelo: "gpt-image-1-mini"
seguranca:
  marcador_ausente: "não localizado"
  envio_automatico: false
  revisao_obrigatoria: true
